<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本語レッスン｜予約システム（プロトタイプ）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F3F7;--card:#FFFFFF;--ink:#1B2540;--ink2:#56627C;--line:#D8DDE6;
  --ac:#2B4A8A;--acSoft:#E4EAF6;--onAc:#FFFFFF;--stamp:#C4322A;
  --ok:#2C7A57;--warn:#8F5A0E;--warnSoft:#FBF0D9;--bad:#B3261E;
  --serif:'Noto Serif TC','Noto Serif JP','Hiragino Mincho ProN','Songti TC','PMingLiU',serif;
  --sans:'Noto Sans TC','Noto Sans JP','Hiragino Sans','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html[lang="ja"]{
  --serif:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho','Noto Serif TC',serif;
  --sans:'Noto Sans JP','Hiragino Sans','Yu Gothic','Noto Sans TC',system-ui,sans-serif;
}
html[lang="en"]{
  --sans:system-ui,-apple-system,'Segoe UI','Noto Sans TC','Noto Sans JP',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10141C;--card:#181D28;--ink:#E8EBF2;--ink2:#9AA4BA;--line:#2A3140;
    --ac:#8FAEEF;--acSoft:#1F2A44;--onAc:#10141C;--stamp:#E5584E;
    --ok:#6CC49A;--warn:#E8B45A;--warnSoft:#3A2F17;--bad:#F08A82;
  }
}
:root[data-theme="dark"]{
  --paper:#10141C;--card:#181D28;--ink:#E8EBF2;--ink2:#9AA4BA;--line:#2A3140;
  --ac:#8FAEEF;--acSoft:#1F2A44;--onAc:#10141C;--stamp:#E5584E;
  --ok:#6CC49A;--warn:#E8B45A;--warnSoft:#3A2F17;--bad:#F08A82;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.65 var(--sans);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;line-height:1.35}
h2{font-size:22px;margin-bottom:16px}
h3{font-size:17px;margin-bottom:10px}
p{margin:0 0 10px}
.muted{color:var(--ink2);font-size:13px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px 56px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0 14px;flex-wrap:wrap}
.brand h1{font-size:24px;letter-spacing:.04em}
.brand span{display:block;font-size:13px;color:var(--ink2)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:8px 16px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ac);color:var(--onAc);font-weight:500}
.langsel{width:auto;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:14px}
.proto{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--ink2);margin-bottom:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.proto button{background:none;border:0;color:var(--ac);cursor:pointer;padding:0;text-decoration:underline;font-size:13px}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px}
.side{position:sticky;top:12px}
@media (max-width:820px){.side{position:static}}

/* steps */
.steps{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 22px;padding:0}
.steps li{border-top:3px solid var(--line);padding-top:6px;font-size:13px;color:var(--ink2)}
.steps li.cur{border-color:var(--ac);color:var(--ink);font-weight:700}
.steps li.done{border-color:var(--ac)}
.steps li.done span::before{content:"✓ "}

/* buttons / fields */
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:10px 18px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--ac);border-color:var(--ac);color:var(--onAc)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.lnk{background:none;border:0;color:var(--ac);cursor:pointer;text-decoration:underline;padding:4px;font-size:13px}
.lnk[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.actions{display:flex;gap:10px;justify-content:space-between;margin-top:22px;flex-wrap:wrap}
.field{margin-bottom:16px}
.field label{display:block;font-weight:500;margin-bottom:5px;font-size:14px}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
textarea{min-height:84px;resize:vertical}
.err{color:var(--bad);font-size:13px;margin-top:4px}

/* login */
.login{max-width:420px;margin:12px auto 0}
.login h2{margin-bottom:6px}
.demo{background:var(--acSoft);border-radius:8px;padding:10px 14px;font-size:13px;margin-top:18px;color:var(--ink2)}
.demo code{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}

/* courses */
.courses{display:grid;gap:12px;margin-bottom:16px}
.course{display:grid;grid-template-columns:1fr auto;gap:2px 16px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:16px 18px;cursor:pointer}
.course:hover{border-color:var(--ac)}
.cn{font-family:var(--serif);font-weight:700;font-size:18px}
.cd{grid-column:1;color:var(--ink2);font-size:14px}
.cp{grid-row:1/3;grid-column:2;align-self:center;font-family:var(--serif);font-weight:700;font-size:20px;color:var(--ac)}

/* dates + slots */
.dates{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:14px}
.date{flex:0 0 auto;min-width:72px;padding:8px 6px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;line-height:1.35}
.date b{display:block;font-size:16px}
.date small{display:block;color:var(--ink2);font-size:12px}
.date[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--onAc)}
.date[aria-pressed="true"] small{color:var(--onAc);opacity:.85}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.slot{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:9px 6px;cursor:pointer;text-align:center;font-weight:500;line-height:1.3}
.slot small{display:block;font-weight:400;font-size:12px;color:var(--ink2)}
.slot[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--onAc)}
.slot[aria-pressed="true"] small{color:var(--onAc);opacity:.85}
.empty{border:1px dashed var(--line);border-radius:8px;padding:28px 18px;text-align:center;color:var(--ink2)}

/* summary / dl */
dl.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
dl.kv dt{color:var(--ink2)}
dl.kv dd{margin:0;word-break:break-word}
.price{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--ac)}

/* payment */
.hold{background:var(--warnSoft);color:var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:18px;font-size:14px}
.hold b{font-variant-numeric:tabular-nums}
.methods{display:grid;gap:8px;margin-bottom:12px}
.method{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:11px 14px;cursor:pointer}
.method i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none}
.method[aria-pressed="true"]{border-color:var(--ac);background:var(--acSoft)}
.method[aria-pressed="true"] i{border-color:var(--ac);background:radial-gradient(var(--ac) 45%,transparent 50%)}
.notice{background:var(--acSoft);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--ink2);margin-bottom:14px}
.fail{background:var(--card);border:1px solid var(--bad);color:var(--bad);border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:14px}

/* done */
.done{text-align:center;padding:10px 0 4px}
.stamp{width:104px;height:104px;color:var(--stamp);transform:rotate(-6deg);animation:stampIn .55s cubic-bezier(.2,.9,.3,1.15) both;margin-bottom:6px}
@keyframes stampIn{0%{transform:scale(1.9) rotate(-16deg);opacity:0}55%{transform:scale(.93) rotate(-5deg);opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}}
.done dl.kv{text-align:left;max-width:440px;margin:18px auto}

/* teacher */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;margin-bottom:-1px;color:var(--ink2)}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-color:var(--ac)}
.stats{display:flex;flex-wrap:wrap;margin-bottom:22px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.stat{flex:1 1 140px;padding:14px 18px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--serif);font-size:24px;line-height:1.2}
.stat span{font-size:13px;color:var(--ink2)}
.wkhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.wkscroll{overflow-x:auto}
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;min-width:920px}
.day{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:170px}
.day.today{border-color:var(--ac)}
.dh{font-size:13px;color:var(--ink2);margin-bottom:8px;display:flex;justify-content:space-between}
.dh b{color:var(--ink)}
.chip{display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:4px;padding:6px 8px;cursor:pointer;font-size:13px;line-height:1.4;margin-bottom:6px}
.chip small{display:block;opacity:.85}
.st-confirmed{background:var(--ac);color:var(--onAc)}
.st-pending{background:var(--warnSoft);color:var(--warn);border-color:var(--warn)}
.st-completed{background:transparent;border-color:var(--line);color:var(--ink2)}
.win{font-size:12px;color:var(--ink2);border:1px dashed var(--line);border-radius:4px;padding:3px 6px;margin-bottom:6px}
.win.extra{border-color:var(--ac);color:var(--ac)}
.off{font-size:12px;color:var(--bad);margin-bottom:6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:12px}
.rrow{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rd{font-family:var(--serif);font-weight:700;padding-top:6px}
.range{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.range input{width:116px}
.exlist{list-style:none;margin:14px 0 0;padding:0}
.exlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.hidden{display:none!important}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:13px}
.filters button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--onAc)}
.blist{display:grid;gap:8px}
.brow{display:grid;grid-template-columns:140px 1fr auto auto;gap:14px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}
.brow.dim{opacity:.6}
.brow small{color:var(--ink2);display:block}
@media (max-width:640px){.brow{grid-template-columns:1fr auto}.brow .c3{display:none}}
.badge{font-size:12px;border-radius:999px;padding:2px 10px;border:1px solid var(--line);white-space:nowrap}
.badge.confirmed{background:var(--acSoft);color:var(--ac);border-color:transparent}
.badge.pending{background:var(--warnSoft);color:var(--warn);border-color:transparent}
.badge.completed{color:var(--ok);border-color:var(--ok)}
.badge.cancelled,.badge.expired{color:var(--ink2)}
.cblock{padding:14px 0;border-bottom:1px solid var(--line)}
.cblock:last-child{border-bottom:0}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(10,15,30,.55);display:grid;place-items:center;padding:16px;z-index:20}
.dialog{background:var(--card);border-radius:10px;max-width:470px;width:100%;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.35);max-height:92%;overflow:auto}
.dialog h3{font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;font-size:14px;z-index:30;max-width:90%}
.gev{font-size:12px;border-radius:4px;padding:3px 6px;margin-bottom:6px;color:var(--ink2);border:1px solid var(--line);background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 6px)}
.chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0;cursor:pointer;font-size:14px}
.chk input{margin-top:5px;width:auto}
ul.plain{padding-left:20px;margin:0 0 18px}
ul.plain li{margin-bottom:6px}
.foot{margin-top:36px;font-size:12px;color:var(--ink2)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>日本語レッスン</h1>
      <span id="brandSub"></span>
    </div>
    <div class="tools">
      <select id="langSel" class="langsel" aria-label="Language / 言語 / 語言">
        <option value="zh">繁體中文</option>
        <option value="ja">日本語</option>
        <option value="en">English</option>
      </select>
      <div class="seg" role="group" aria-label="View">
        <button id="roleS" data-act="role" data-v="student" aria-pressed="true"></button>
        <button id="roleT" data-act="role" data-v="teacher" aria-pressed="false"></button>
      </div>
      <button class="btn sm hidden" id="logoutBtn" data-act="logout">ログアウト</button>
    </div>
  </header>
  <div class="proto">
    <span id="protoNote"></span>
    <button id="resetBtn" data-act="reset"></button>
  </div>
  <main id="app"></main>
  <p class="foot" id="footNote"></p>
</div>
<div id="toastHost"></div>

<script>
(function(){
'use strict';
var OFFSET=8*3600000, MIN=60000, HOUR=3600000;
var BUFFER=10*MIN, NOTICE=12*HOUR, HOLD=15*MIN, STEP=HOUR, HORIZON=28, CHANGE_LIMIT=24*HOUR;
var STORE='jp-booking-proto-v5', LANGKEY='jp-booking-proto-lang', TP='Asia/Taipei';
var AUTH_SALT='jp-lesson-proto-v1', AUTH_ITER=150000, AUTH_HASH='97073f85e3846598a641ccfb96d7e040738f2bcef0a641bf83ace22d7e603470';
var ORDER=[1,2,3,4,5,6,0];
var WDN={zh:['日','一','二','三','四','五','六'],ja:['日','月','火','水','木','金','土'],en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat']};
var HTML_LANG={zh:'zh-Hant',ja:'ja',en:'en'};

/* ---------- translations (student page: zh / ja / en; teacher dashboard is Japanese only) ---------- */
var I18N={
zh:{
  appSub:'線上預約',roleStudent:'學生預約頁',roleTeacher:'老師後台',reset:'重設示範資料',
  protoNote:'原型示範：上方可切換學生與老師畫面；付款為模擬，不會扣款；資料只存在這個瀏覽器。',
  footNote:'可預約時段 ＝ 老師每週開放的時段 − 休假日 ＋ 加開時段 − 已被預約的時間（前後各留 10 分鐘休息），且需在上課 12 小時前預約。課程皆從整點開始，老師行事曆（Google 日曆）上已有行程的時間不會開放預約。',
  step1:'選課程',step2:'選時段',step3:'填資料',step4:'付款',

  s1Title:'想上哪一種課？',s1Policy:'取消規則（示範）：上課 24 小時前取消，全額退款。',
  s2Title:'選擇上課時間',tzLabel:'顯示時區',slotsN:'{n} 個時段',taiwanShort:'台灣',back:'上一步',next:'下一步',
  noSlots:'目前沒有可預約的時段。老師開放新時段後，會顯示在這裡。',
  s3Title:'你的聯絡資料',fName:'姓名或暱稱',fEmail:'Email（確認信與上課連結會寄到這裡）',fNote:'想讓老師先知道的事（選填）',fNotePh:'例如：目前程度、想考的檢定、想加強的部分',

  demoNotice:'這是原型：按下付款只會模擬付款成功，不會真的扣款。實際串接金流時，會在這一步跳轉到付款頁面。',
  payFail:'付款未完成：銀行拒絕這筆交易。你的時段仍保留到倒數結束，可以換一種付款方式再試一次。',
  cvsNote:'真實流程中，超商與 ATM 要繳費後才會確認，保留時間會設得更長（例如 3 天）。這裡直接模擬成功。',
  processing:'處理中…',payBtn:'付款 {price}',simFail:'模擬付款失敗',
  expTitle:'保留時間已結束',expBody:'為了讓其他同學也有機會預約，未在 15 分鐘內完成付款的時段已經釋出。請重新選擇時段。',expBtn:'重新選擇時段',conflictTitle:'這個時段已無法預約',conflictBody:'老師剛剛在行事曆新增了行程，這個時段已經無法上課。這筆款項不會被收取，請重新選擇其他時段。',
  doneTitle:'預約完成',doneMail:'確認信已寄到 {email}（原型不會真的寄信）',dCourse:'課程',dTime:'時間',dTaiwan:'台灣時間',dLink:'上課連結',dLinkDemo:'示範連結，不是真的會議室',dPay:'付款',
  dReminder:'上課前 24 小時前可免費取消或改期。',dAnother:'再預約一堂',dSeeTeacher:'到老師後台看看這筆預約',mins:'{n} 分鐘',
  toastReset:'已重設為示範資料',notFound:'找不到這筆預約。',stampAria:'預約完成印章',
  m_card:'信用卡（Visa／Mastercard／JCB）',m_linepay:'LINE Pay',m_cvs:'超商代碼繳費',m_atm:'ATM 轉帳',m_paypal:'PayPal',
  navBook:'預約課程',navManage:'管理我的預約',

  var closed=ex.some(function(e){return e.type==='closed';});
  var w=[];
  if(!closed)(S.rules[wday(ymd)]||[]).forEach(function(r){w.push({s:tpTs(ymd,r.s),e:tpTs(ymd,r.e),extra:false});});
  ex.filter(function(e){return e.type==='extra';}).forEach(function(e){w.push({s:tpTs(ymd,e.start),e:tpTs(ymd,e.end),extra:true});});
  return w.sort(function(a,b){return a.s-b.s;});
}
function isActive(b,now){return b.status==='confirmed'||b.status==='completed'||(b.status==='pending'&&b.expires>now);}
function evRange(ev){
  if(ev.allDay){var a=tpTs(ev.date,'00:00');return {a:a,b:a+24*HOUR,buf:0};}
  return {a:tpTs(ev.date,ev.start),b:tpTs(ev.date,ev.end),buf:BUFFER};
}
function gcalBusy(start,end){
  var g=S.gcal;if(!g||!g.connected||!g.block)return false;
  return g.events.some(function(ev){var r=evRange(ev);return start<r.b+r.buf&&end+r.buf>r.a;});
}
function isFree(start,end,ignoreId){
  var now=Date.now();
  if(gcalBusy(start,end))return false;
  return !S.bookings.some(function(b){return b.id!==ignoreId&&isActive(b,now)&&start<b.end+BUFFER&&end+BUFFER>b.start;});
}
function slotsFor(course,ignoreId){
  var now=Date.now(),t0=tpYmd(now),dur=course.min*MIN,seen={},out=[];
  for(var i=0;i<HORIZON;i++){
    windowsFor(addDays(t0,i)).forEach(function(w){
      for(var x=Math.ceil(w.s/HOUR)*HOUR;x+dur<=w.e;x+=STEP){
        if(x>=now+NOTICE&&!seen[x]&&isFree(x,x+dur,ignoreId)){seen[x]=1;out.push(x);}
      }
    });
  }
  return out.sort(function(a,b){return a-b;});
}

  return S.bookings.filter(function(b){return (b.status==='confirmed'||b.status==='completed'||(b.status==='cancelled'&&b.refund==='none'))&&b.paidAt&&tpYmd(b.paidAt).slice(0,7)===ym;}).reduce(function(a,b){return a+b.price;},0);
}
function statsHtml(){
  var now=Date.now(),wkEnd=now+7*24*HOUR;
  var up=S.bookings.filter(function(b){return b.status==='confirmed'&&b.start>now;});
  var wk=up.filter(function(b){return b.start<wkEnd;});
  var pend=S.bookings.filter(function(b){return b.status==='pending'&&b.expires>now;});
  return '<div class="stats"><div class="stat"><b>'+wk.length+'</b><span>今後7日間のレッスン</span></div><div class="stat"><b>'+up.length+'</b><span>確定済み・未実施</span></div><div class="stat"><b>'+pend.length+'</b><span>支払い待ち（枠を確保中）</span></div><div class="stat"><b>'+money(monthRevenue())+'</b><span>今月の入金</span></div></div>';
}
function calendarHtml(){
  var today=tpYmd(Date.now()),diff=(wday(today)+6)%7,mon=addDays(today,-diff+7*U.weekOff),now=Date.now(),cols='';
  for(var i=0;i<7;i++){
    (function(ymd){
      var dl=dayLabel(ymd),items=[];
      var ex=S.exceptions.filter(function(e){return e.date===ymd;});
      windowsFor(ymd).forEach(function(w){items.push({t:w.s,h:'<div class="win'+(w.extra?' extra':'')+'">'+(w.extra?'臨時 ':'受付 ')+localTime(w.s,TP)+'–'+localTime(w.e,TP)+'</div>'});});
      if(S.gcal.connected)S.gcal.events.filter(function(ev){return ev.date===ymd;}).forEach(function(ev){
        var r=evRange(ev);items.push({t:r.a-2,h:'<div class="gev">Google '+(ev.allDay?'終日':ev.start+'–'+ev.end)+' '+esc(ev.title)+'</div>'});
      });
      S.bookings.filter(function(b){return isActive(b,now)&&tpYmd(b.start)===ymd;}).forEach(function(b){
        items.push({t:b.start-1,h:'<button class="chip st-'+b.status+'" data-act="openBooking" data-id="'+b.id+'">'+localTime(b.start,TP)+' '+esc(b.name)+'<small>'+esc(L(b.courseName))+(b.status==='pending'?'・支払い待ち':'')+(b.gcal?'・Google済':'')+'</small></button>'});
      });
      items.sort(function(a,b){return a.t-b.t;});
      cols+='<div class="day'+(ymd===today?' today':'')+'"><div class="dh"><span>'+dl.wd+'曜</span><b>'+dl.md+'</b></div>'+
        (ex.some(function(e){return e.type==='closed';})?'<div class="off">休み</div>':'')+
        (items.length?items.map(function(x){return x.h;}).join(''):'<div class="muted">受付なし</div>')+'</div>';
    })(addDays(mon,i));
  }
  var a=dayLabel(mon),z=dayLabel(addDays(mon,6));
  return '<div class="wkhead"><div class="row"><button class="btn sm" data-act="week" data-d="-1">前の週</button><button class="btn sm" data-act="week" data-d="0">今週</button><button class="btn sm" data-act="week" data-d="1">次の週</button></div><b>'+a.md+' – '+z.md+'（台湾時間）</b></div>'+
    '<div class="wkscroll"><div class="week">'+cols+'</div></div>'+
    '<div class="legend"><span>塗りつぶし：確定済み</span><span>黄色：枠を確保中（支払い待ち）</span><span>枠線：実施済み</span><span>破線：受付時間</span><span>斜線：Googleカレンダーの予定（予約不可）</span></div>';
}
function bookingsHtml(){
  var now=Date.now(),F=U.filter;
  var list=S.bookings.slice().sort(function(a,b){return b.start-a.start;}).filter(function(b){
    if(F==='upcoming')return b.status==='confirmed'&&b.start>now;
    if(F==='pending')return b.status==='pending'&&b.expires>now;
    if(F==='completed')return b.status==='completed'||(b.status==='confirmed'&&b.start<=now);
    if(F==='cancelled')return b.status==='cancelled'||b.status==='expired'||(b.status==='pending'&&b.expires<=now);
    return true;
  });
  var fl=[['all','すべて'],['upcoming','実施予定'],['pending','支払い待ち'],['completed','実施済み'],['cancelled','キャンセル／期限切れ']];

    (list.length?'<div class="blist">'+list.map(function(b){

function seedGcalEvents(){
  var t0=tpYmd(Date.now()),out=[],haveDay=false,haveAll=false;
  for(var i=1;i<28&&(!haveDay||!haveAll);i++){
    var ymd=addDays(t0,i),w=windowsFor(ymd);
    if(!w.length)continue;
    if(!haveDay&&wday(ymd)!==6){
      out.push({id:'G'+(S.gcal.seq++),title:'歯科検診',date:ymd,allDay:false,start:localTime(w[0].s+HOUR,TP),end:localTime(w[0].s+2*HOUR,TP)});haveDay=true;
    } else if(!haveAll&&wday(ymd)===6&&i>7){
      out.push({id:'G'+(S.gcal.seq++),title:'家族旅行',date:ymd,allDay:true,start:'',end:''});haveAll=true;
    }
  }
  return out;
}
function overlapBookings(ev){
  var r=evRange(ev),now=Date.now();

}

function validateInfo(){
  var e={},f=U.form;
  if(!f.name.trim())e.name='errName';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim()))e.email='errEmail';
  U.errors=e;return !Object.keys(e).length;
}
function dropHold(){
  var b=holdBooking();
  if(b&&b.status==='pending'){S.bookings=S.bookings.filter(function(x){return x.id!==b.id;});save();}
  U.holdId=null;U.payError=false;U.paying=false;
}
function hashLogin(email,pw){
  var enc=new TextEncoder();
  return crypto.subtle.importKey('raw',enc.encode(email+'\n'+pw),'PBKDF2',false,['deriveBits']).then(function(k){
    return crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(AUTH_SALT),iterations:AUTH_ITER,hash:'SHA-256'},k,256);
  }).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');
  });
}
function doLogin(){
  var now=Date.now();if(U.lockUntil>now||U.checking)return;
  var em=$('#lgEmail').value.trim().toLowerCase(),pw=$('#lgPass').value;
  U.loginEmail=em;
  if(!(window.crypto&&crypto.subtle)){U.loginErr='nocrypto';render();return;}
  U.checking=true;
  hashLogin(em,pw).then(function(hx){
    U.checking=false;
    if(hx===AUTH_HASH){U.authed=true;U.fails=0;U.loginErr='';U.lockUntil=0;U.tab='calendar';toast('ログインしました');}
    else{U.fails++;if(U.fails>=5){U.lockUntil=Date.now()+30000;U.fails=0;U.loginErr='lock';}else U.loginErr='bad';}
    render();
  }).catch(function(){U.checking=false;U.loginErr='nocrypto';render();});
}
function act(a,el){
  var d=el.dataset;
  switch(a){
    case 'role':U.role=d.v;U.modal=null;break;
    case 'sview':U.sview=d.v;break;
    case 'mgOpen':{var ob=S.bookings.filter(function(x){return x.id===d.id;})[0];if(ob){U.sview='manage';U.mg={email:ob.email,ref:ob.ref,id:ob.id,mode:'view',err:''};U.selSlot=null;U.selDate=null;}break;}
    case 'mgView':U.mg.mode='view';U.mg.err='';U.selSlot=null;break;
    case 'mgResched':U.mg.mode='resched';U.mg.err='';U.selSlot=null;U.selDate=null;break;
    case 'mgAskCancel':U.mg.mode='cancelConfirm';break;
    case 'doResched':{
      var rb=mgBooking();if(!rb||!U.selSlot)break;
      var rd=rb.end-rb.start;
      if(rb.start-Date.now()<CHANGE_LIMIT||U.selSlot<Date.now()+NOTICE||!isFree(U.selSlot,U.selSlot+rd,rb.id)){U.mg.err='mgSlotTaken';U.selSlot=null;break;}
      U.mg.oldStart=rb.start;rb.start=U.selSlot;rb.end=U.selSlot+rd;rb.rescheduled=(rb.rescheduled||0)+1;
      U.mg.mode='reschedDone';U.mg.err='';U.selSlot=null;save();break;
    }
    case 'doStudentCancel':{
      var cb=mgBooking();if(!cb||cb.status!=='confirmed')break;
      cb.refund=(cb.start-Date.now()>=CHANGE_LIMIT)?'full':'none';
      cb.status='cancelled';cb.cancelledBy='student';cb.gcal=false;U.mg.mode='cancelled';save();break;
    }
    case 'mgNewBook':U.sview='book';U.step=1;U.selSlot=null;U.selDate=null;U.holdId=null;U.doneId=null;U.form={name:'',email:'',note:''};U.errors={};break;
    case 'logout':U.authed=false;U.modal=null;U.loginEmail='';U.loginErr='';U.role='student';toast('Logged out / ログアウトしました');break;
    case 'forgot':toast('再設定用のリンクをメールで送信します（デモでは送信されません）');return;
    case 'reset':
      try{localStorage.removeItem(STORE);}catch(e){}
      S=freshState();seedBookings();save();var lg=U.lang;U=freshUI();U.lang=lg;toast(t('toastReset'));break;
    case 'pickCourse':U.courseId=d.id;U.selSlot=null;U.selDate=null;U.step=2;break;
    case 'pickDate':U.selDate=d.k;break;
    case 'pickSlot':U.selSlot=Number(d.t);break;
    case 'goInfo':if(U.selSlot)U.step=3;break;
    case 'back':U.step=Math.max(1,U.step-1);U.errors={};break;
    case 'toPay':
      if(!validateInfo())break;
      var c=currentCourse(),dur=c.min*MIN;
      if(!U.selSlot||!isFree(U.selSlot,U.selSlot+dur)||U.selSlot<Date.now()+NOTICE){U.errors={slot:'errSlot'};U.selSlot=null;break;}
      var h=addBooking({courseId:c.id,start:U.selSlot,name:U.form.name.trim(),email:U.form.email.trim(),tz:U.tz,note:U.form.note.trim(),status:'pending',expires:Date.now()+HOLD});
      U.holdId=h.id;save();U.step=4;U.payError=false;break;
    case 'backFromPay':dropHold();U.conflict=false;U.step=3;break;
    case 'restartTime':dropHold();U.conflict=false;U.selSlot=null;U.step=2;break;
    case 'method':U.method=d.k;break;
    case 'payFail':U.payError=true;break;
    case 'pay':
      U.paying=true;U.payError=false;render();
      setTimeout(function(){
        var b=holdBooking();U.paying=false;
        if(!b||b.status!=='pending'||b.expires<=Date.now()){render();return;}
        if(gcalBusy(b.start,b.end)){b.status='expired';U.conflict=true;save();render();return;}
        b.status='confirmed';b.paidAt=Date.now();b.method=U.method;b.link=fakeLink();b.expires=null;
        if(S.gcal.connected&&S.gcal.push)b.gcal=true;
        save();U.doneId=b.id;U.holdId=null;U.step=5;render();
      },1300);
      return;
    case 'restart':U.sview='book';U.step=1;U.selSlot=null;U.selDate=null;U.holdId=null;U.doneId=null;U.form={name:'',email:'',note:''};U.errors={};break;
    case 'tab':U.tab=d.v;U.exMsg='';break;
    case 'week':U.weekOff=d.d==='0'?0:U.weekOff+Number(d.d);break;
    case 'filter':U.filter=d.v;break;
    case 'openBooking':U.modal={id:d.id};break;
    case 'closeModal':case 'keepBooking':U.modal=null;break;
    case 'overlay':if(el!==window.__evtTarget)return;U.modal=null;break;
    case 'askCancel':U.modal.confirmCancel=true;break;
    case 'complete':
      S.bookings.forEach(function(b){if(b.id===d.id&&b.status==='confirmed')b.status='completed';});
      save();U.modal=null;toast('レッスン完了にしました');break;
    case 'doCancel':
      S.bookings.forEach(function(b){if(b.id===d.id){b.status='cancelled';b.refund='full';b.cancelledBy='teacher';}});
      var wasG=false;S.bookings.forEach(function(b){if(b.id===d.id&&b.gcal){wasG=true;b.gcal=false;}});
      save();U.modal=null;toast(wasG?'キャンセルし、返金済みにしました（Googleカレンダーの予定も削除しました）':'キャンセルし、返金済みにしました');break;
    case 'gConnect':
      S.gcal.connected=true;S.gcal.account='teacher@gmail.com';S.gcal.events=seedGcalEvents();S.gcal.lastSync=Date.now();U.gMsg='';save();toast('Googleカレンダーと連携しました（デモ）');break;
    case 'gDisconnect':
      S.gcal.connected=false;S.gcal.account='';S.gcal.events=[];S.gcal.lastSync=null;U.gMsg='';save();toast('連携を解除しました');break;
    case 'gAdd':
      var gt=$('#gTitle').value.trim()||'（タイトルなし）',gd=$('#gDate').value,ga=$('#gAll').checked,gs=$('#gS').value,ge=$('#gE').value;
      if(!gd){U.gMsg='err:日付を選んでください';break;}
      if(!ga&&(!gs||!ge||ge<=gs)){U.gMsg='err:終了時刻は開始時刻より後にしてください';break;}
      var ev={id:'G'+(S.gcal.seq++),title:gt,date:gd,allDay:ga,start:ga?'':gs,end:ga?'':ge};
      S.gcal.events.push(ev);S.gcal.lastSync=Date.now();
      var ov=overlapBookings(ev);
      U.gMsg=ov.length?('warn:注意：確定済みの予約（'+ov.map(function(x){return x.name;}).join('、')+'さん）と重なっています。必要なら予約一覧から調整してください。'):'ok:Googleカレンダーに予定を追加しました。この時間は生徒の予約ページから非表示になります。';
      save();break;
    case 'gDel':
      S.gcal.events=S.gcal.events.filter(function(x){return x.id!==d.id;});S.gcal.lastSync=Date.now();U.gMsg='ok:予定を削除しました。この時間は再び予約できるようになります。';save();break;
    case 'addRange':(S.rules[d.d]=S.rules[d.d]||[]).push({s:'19:00',e:'21:00'});save();break;
    case 'delRange':S.rules[d.d].splice(Number(d.i),1);save();break;
    case 'addExc':
      var date=$('#exDate').value,type=$('#exType').value,s=$('#exS').value,e2=$('#exE').value;
      if(!date){U.exMsg='日付を選んでください';break;}
      if(type==='extra'&&(!s||!e2||e2<=s)){U.exMsg='終了時刻は開始時刻より後にしてください';break;}
      U.exMsg='';
      S.exceptions.push({id:'E'+Date.now(),date:date,type:type,start:s,end:e2});save();
      toast(type==='closed'?'お休みを設定しました':'臨時の受付を追加しました');break;
    case 'delExc':S.exceptions=S.exceptions.filter(function(x){return x.id!==d.id;});save();break;
  }
  render();
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  window.__evtTarget=e.target;
  act(el.dataset.act,el);
});
function doFind(){
  var em=U.mg.email.trim().toLowerCase(),rf=U.mg.ref.trim().toUpperCase();
  var b=S.bookings.filter(function(x){return x.email.toLowerCase()===em&&x.ref===rf&&(x.status==='confirmed'||x.status==='completed'||x.status==='cancelled');})[0];
  if(!b){U.mg.err='mgNotFound';render();return;}
  U.mg={email:em,ref:rf,id:b.id,mode:'view',err:''};U.tz=b.tz;U.selSlot=null;U.selDate=null;render();
}
document.addEventListener('submit',function(e){
  if(e.target.id==='loginForm'){e.preventDefault();doLogin();}
  if(e.target.id==='mgForm'){e.preventDefault();doFind();}
});
document.addEventListener('input',function(e){
  var x=e.target;
  if(x.dataset&&x.dataset.form)U.form[x.dataset.form]=x.value;
  if(x.dataset&&x.dataset.login==='email')U.loginEmail=x.value;
  if(x.dataset&&x.dataset.mg)U.mg[x.dataset.mg]=x.value;
});
document.addEventListener('change',function(e){
  var x=e.target;
  if(x.id==='langSel'){
    U.lang=x.value;try{localStorage.setItem(LANGKEY,U.lang);}catch(err){}
    render();return;
  }
  if(x.dataset&&x.dataset.bind==='tz'){U.tz=x.value;U.selDate=U.selSlot?localKey(U.selSlot,U.tz):null;render();return;}
  if(x.id==='exType'){var box=$('#exTimes');if(box)box.classList.toggle('hidden',x.value!=='extra');return;}
  if(x.id==='gAll'){var gb=$('#gTimes');if(gb)gb.classList.toggle('hidden',x.checked);return;}
  if(!U.authed)return;
  if(x.dataset&&x.dataset.gset){S.gcal[x.dataset.gset]=x.checked;save();toast('保存しました');render();return;}
  if(x.dataset&&x.dataset.rule){
    var p=x.dataset.rule.split('|'),r=S.rules[p[0]][Number(p[1])];
    var old=r[p[2]];r[p[2]]=x.value;
    if(!r.s||!r.e||r.e<=r.s){r[p[2]]=old;toast('終了時刻は開始時刻より後にしてください');render();return;}
    save();toast('更新しました');return;
  }
  if(x.dataset&&x.dataset.course){
    var q=x.dataset.course.split('|'),c=courseById(q[0]);
    if(q[1]==='name'){c.name[q[2]]=x.value.trim()||c.name[q[2]];}
    else{var v=Number(x.value);if(!isFinite(v)||v<0){render();return;}c[q[1]]=v;}
    save();toast('保存しました');
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&U.modal){U.modal=null;render();}
});

/* hold expiry, countdown, login lock timer */
setInterval(function(){
  var now=Date.now(),changed=false;
  S.bookings.forEach(function(b){if(b.status==='pending'&&b.expires<=now){b.status='expired';changed=true;}});
  if(changed){save();render();return;}
  var el=$('#cd');if(el){var b=holdBooking();if(b)el.textContent=mmss(b.expires-now);}
  if(U.role==='teacher'&&!U.authed&&U.lockUntil){
    if(now>=U.lockUntil){U.lockUntil=0;U.loginErr='';render();}
    else{var s=$('#lockSec');if(s)s.textContent=Math.ceil((U.lockUntil-now)/1000);}
  }
},1000);

/* boot */
S=loadState();
if(S&&S.courses&&!S.gcal)S.gcal=freshState().gcal;
if(!S||!S.courses||!S.courses[0].name||typeof S.courses[0].name!=='object'){S=freshState();U=freshUI();seedBookings();save();}
else U=freshUI();
render();
})();
</script>
</body>
</html>
